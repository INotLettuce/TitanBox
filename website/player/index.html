<!DOCTYPE html>
<html lang="en">

<head>
	<link rel="icon" type="image/svg+xml" href="../titanbox-mark.svg" />
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>TitanBox Song Player</title>
	<meta name="description"
		content="TitanBox is a BeepBox-family music editor with expanded synthesis and composition features." />
	<meta name="keywords"
		content="chiptune, instrumental, music, melody, composition, tool, square wave, NES, NSF, BeepBox" />
	<meta name="theme-color" content="#16191c" />
	<meta property="og:image" content="../titanbox-mark.svg" />
	<meta name="format-detection" content="telephone=no" />
	<link rel="apple-touch-icon" href="../titanbox-mark.svg" />
	<link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" rel="stylesheet" media="none"
		onload="if (this.media != 'all') this.media='all';" /> <!-- this is a trick to load CSS asynchronously. -->
	<meta name="robots" content="noindex, nofollow" />
	<style>
		html {
			width: 100vw;
			font-family: 'Roboto', sans-serif;
			color: var(--primary-text, white);
			align-items: center;
		}

		html,
		body {
			height: 100%;
			overflow: hidden;
			display: flex;
			margin: 0;
			padding: 0;
			background: var(--page-margin, black);
		}

		body {
			width: 100vw;
			flex-direction: column;
			align-items: stretch;
		}
	</style>
</head>

<body>
	<script type="text/javascript">
		function browserHasRequiredFeatures() {
			"use strict";
			if (window.AudioContext == undefined && window.webkitAudioContext == undefined) {
				return false;
			}

			try {
				eval("class T {}");
				eval("const a = () => 0");
				eval("for (const a of []);");
			} catch (error) {
				return false;
			}

			return true;
		}

		if (browserHasRequiredFeatures()) {
			// Go ahead and load js beepbox editor interface:
			var fileref = document.createElement("script");
			fileref.setAttribute("type", "text/javascript");
			const date = new Date();
			if (((date.getDate() == 1) && date.getMonth() == 3) && false) {
				fileref.setAttribute("src", "foolish_player.min.js");
			} else {
				fileref.setAttribute("src", "beepbox_player.min.js");
			}
			document.head.appendChild(fileref);
			document.head.appendChild(fileref);
		} else {
			document.body.innerHTML = "Sorry, BeepBox doesn't support your browser. Try a recent version of Chrome, Firefox, Edge, Safari, or Opera.";
		}
	</script>
</body>

</html>
